# ============================================================
# SenseFrame 项目配置（PEP 621 标准）
# ============================================================
# 替代原 requirements.txt，统一项目元数据 + 依赖 + 工具配置。
# 安装方式：
#   pip install .           # 仅核心依赖
#   pip install -e .        # 可编辑模式（开发）
#   pip install -e .[eeg]   # 核心 + EEG 可选依赖
#   pip install -e .[radio] # 核心 + Radio 可选依赖
#   pip install -e .[dev]   # 核心 + 开发工具
#   pip install -e .[otel]  # 核心 + OpenTelemetry 可观测性
#   pip install -e .[all]   # 全部可选依赖

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "senseframe"
dynamic = ["version"]
description = "AI Agent 驱动的 AutoML 训练框架（RFC 控制权反转）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SenseFrame Contributors" },
]
keywords = ["automl", "pytorch", "deep-learning", "csi", "eeg", "signal-processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# 核心依赖（原 requirements.txt 主体）
# 安装方式：pip install .
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pytorch-lightning>=2.0.0",
    "torchmetrics>=0.11.0",
    "pydantic>=2.0.0",      # engine/config.py ExperimentConfig 用 pydantic v2
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "einops>=0.6.0",        # SenseFi 基准模型隐式依赖
    "optuna>=3.5.0",        # HPO 超参搜索（Stage 4）
    "mcp>=1.0.0",           # MCP server（senseframe.mcp 核心模块依赖）
]

[project.optional-dependencies]
# EEG 数据集支持：PhysioNet .edf 加载
eeg = [
    "mne>=1.5.0",
]

# Radio 信号数据集支持：RadioML 2018.01A HDF5 加载
radio = [
    "h5py>=3.8.0",
]

# ONNX 模型导出（推理服务）
onnx = [
    "onnx>=1.14.0",
]

# OpenTelemetry 可观测性（RFC-003 OBP）
# 替代原 requirements-otel.txt 的注释行
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-prometheus>=0.41b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "prometheus_client>=0.17.0",
]

# 开发工具：测试 + 类型检查 + 文档
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",  # I20: 异步测试支持（asyncio mode=strict）
    'tomli>=2.0.0; python_version < "3.11"',
]

# 全部可选依赖一键安装
all = [
    "senseframe[eeg,radio,onnx,otel,dev]",
]

# ============================================================
# console_scripts：注册 senseframe 命令（v2 次要差距修复）
# ============================================================
[project.scripts]
senseframe = "senseframe.cli:main"

[project.urls]
Homepage = "https://github.com/senseframe/senseframe"
Documentation = "https://github.com/senseframe/senseframe#readme"
Issues = "https://github.com/senseframe/senseframe/issues"

# ============================================================
# 动态版本：从 senseframe/__init__.py 的 __version__ 读取
# ============================================================
[tool.setuptools.dynamic]
version = { attr = "senseframe.__version__" }

# ============================================================
# setuptools 包发现配置
# ============================================================
[tool.setuptools.packages.find]
include = ["senseframe*"]
exclude = ["tests*", "scripts*", "examples*", "commands*", "reference*"]

# 包含非 Python 文件（数据集 spec / 配置 / SKILL 模板）
[tool.setuptools.package-data]
senseframe = ["py.typed", "*.yaml", "*.yml"]

# ============================================================
# pytest 配置
# ============================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: 标记跑得慢的测试",
    "integration: 集成测试（需要真实数据集/模型）",
    "gpu: 需要 GPU 的测试",
    "e2e: 端到端测试（跑真实训练，默认跳过，-m e2e 启用）",
    "requires_data: 需要外部数据集（SENSEFRAME_DATA_ROOT 未设置时跳过）",
    # 测试分层重构（plan_test_refactor_v1.md）：4 层 marker
    "l1_contract: L1 外部协议契约测试（锚点：外部协议/库 API）",
    "l2_orchestration: L2 编排 spec 契约测试（锚点：项目内 RFC/设计文档）",
    "l3_algorithm: L3 算法行为测试（锚点：论文/官方实现）",
    "l4_regression: L4 回归测试（锚点：bug 编号 + 修复 commit）",
]

# ============================================================
# ruff 配置（lint + format）
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "examples",
    "reference",
    "commands",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long（由 formatter 处理）
    "B008",  # function call in default argument（pydantic/FastAPI 惯例）
]

[tool.ruff.lint.isort]
known-first-party = ["senseframe"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
