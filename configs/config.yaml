# 示例配置：UT_HAR + ResNet18 监督学习
# 符合 ExperimentConfig schema，可用 validate_config.py 校验
scene:
  name: wifi_csi
  dataset: UT_HAR_data
  model_id: ResNet18
  learning_mode: supervised
  # data_root 必填：数据根目录绝对路径（如 /home/user/CSI_DATASETS）
  # 三选一：YAML 此字段 / CLI --data-root / env SENSEFRAME_DATA_ROOT
  data_root: ""
  params:
    metrics: [accuracy, macro_f1, micro_f1]
    average: macro

input_features:
  - name: csi
    type: csi
    shape: [1, 250, 90]

output_features:
  - name: action
    type: category
    num_classes: 7

trainer:
  epochs: 200
  learning_rate: 0.001
  batch_size: 64
  optimizer: adam  # adam / adamw / sgd / rmsprop
  seed: 42
  # ---- TrainerConfig 可选字段（默认即最佳实践，按需取消注释覆盖）----
  # weight_decay: 1.0e-4              # L2 正则系数，默认 1e-4
  # early_stopping: 5                 # 早停 patience（epoch 数），None=不启用早停
  # early_stopping_min_delta: 0.001   # 视为提升的最小 val_loss 变化阈值
  # early_stopping_monitor: val_loss  # 监控指标名，默认 val_loss
  # scheduler: cosine                 # None / cosine / step，默认 cosine
  # gradient_clip_val: null           # 梯度裁剪阈值，null=不裁剪（须 > 0）
  # gradient_clip_algorithm: norm     # norm / value
  # mixed_precision: null             # True=16-mixed, False=32, "bf16-mixed", null=自动
  # deterministic: false              # 确定性模式（需 CUDA + cuDNN 支持）
  # num_workers: null                 # DataLoader 进程数，null=由 routing 按资源自动派生
  # accumulate_grad_batches: 1        # 梯度累积步数（等效大 batch）
  # logger: csv                       # csv / tensorboard / wandb / none
  # gpu: null                         # 指定 GPU ID，null=自动
  # auto_lr_find: false               # 自动 LR 标定（耗时约 1 epoch，仅监督模式）
  # ---- pin_memory 非 TrainerConfig 字段：由 routing 自动派生（仅 GPU 路由启用），
  #      不通过 YAML 配置，详见 reference/reference_resource_routing.md ----

output_dir: runs
save_model: true

